<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container" class="container">
        <div class="auth-wrapper">
            <div class="card auth-card turn-in" id="auth-card-box">
                <h2 id="auth-title">Login</h2>
                <form id="auth-form">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label id="password-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required>
                            <button type="button" id="toggle-password" class="show-pwd-btn" title="Show/Hide Password">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group hidden" id="confirm-password-group">
                        <label>Re-enter Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password">
                            <button type="button" id="toggle-confirm-password" class="show-pwd-btn" title="Show/Hide Password">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="auth-btn">Login</button>
                </form>
                <p class="switch-auth">
                    <span id="switch-text">Don't have an account?</span> 
                    <a href="#" id="switch-btn">Register</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-container" class="container hidden">
        <header class="header">
            <h1>💰 Auspify Expense Tracker</h1>
            <div class="user-info">
                <span>Hello, <strong id="user-display">User</strong></span>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </header>

        <!-- Summary -->
        <div class="summary-grid">
            <div class="card summary-card balance">
                <h3>Total Balance</h3>
                <p id="total-balance">₹0.00</p>
            </div>
            <div class="card summary-card income">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="card summary-card expense">
                <h3>Total Expenses</h3>
                <p id="total-expense">₹0.00</p>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Add Transaction Form -->
            <div class="card">
                <h3>Add New Transaction</h3>
                <form id="transaction-form">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" placeholder="e.g., Salary, Groceries" required>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="category" placeholder="e.g., Food, Rent, Salary" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn btn-success">Add Transaction</button>
                </form>
            </div>

            <!-- Transaction History -->
            <div class="card">
                <h3>Transaction History</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
